name: Android Capacitor build

on:
  push:
    branches: [android/capacitor-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare bundled web application
        run: npm run build:web

      - name: Generate native Android project
        run: npx cap add android

      - name: Generate adaptive icon and splash resources
        run: npm run native:assets

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Configure Android version
        run: bash scripts/configure-android-version.sh

      - name: Verify native configuration and complete module set
        shell: bash
        run: |
          set -euo pipefail
          grep -R 'applicationId "pl.aimonitor.zywienia"' android/app/build.gradle
          grep -R 'versionCode 4' android/app/build.gradle
          grep -R 'versionName "1.0.3"' android/app/build.gradle

          PUBLIC_DIR='android/app/src/main/assets/public'
          modules=(
            index.html
            app.js
            app-core-v13.js
            auth-login-v2.js
            confirm-modal.js
            analysis-item-removal.js
            analysis-cancel.js
            photo-compression.js
            native-camera.js
            install-flow-fix.js
            goals-calculator.js
            account-recovery.js
            water-tracker.js
            water-compat.js
            water-performance.js
            hydration-display.js
            history-hydration.js
            theme-manager.js
            day-refresh.js
            native-bootstrap.js
          )

          for module in "${modules[@]}"; do
            test -s "$PUBLIC_DIR/$module" || {
              echo "Missing required Android module: $module" >&2
              exit 1
            }
          done

          grep -F "'./photo-compression.js?v=20260816-camera1'" "$PUBLIC_DIR/app.js"
          grep -F "'./native-camera.js?v=20260816-camera1'" "$PUBLIC_DIR/app.js"
          grep -F "'./theme-manager.js?v=20260816-theme2'" "$PUBLIC_DIR/app.js"
          grep -F "'./day-refresh.js?v=20260816-refresh2'" "$PUBLIC_DIR/app.js"

          photo_line="$(grep -n -F "'./photo-compression.js?v=20260816-camera1'" "$PUBLIC_DIR/app.js" | head -1 | cut -d: -f1)"
          camera_line="$(grep -n -F "'./native-camera.js?v=20260816-camera1'" "$PUBLIC_DIR/app.js" | head -1 | cut -d: -f1)"
          theme_line="$(grep -n -F "'./theme-manager.js?v=20260816-theme2'" "$PUBLIC_DIR/app.js" | head -1 | cut -d: -f1)"
          refresh_line="$(grep -n -F "'./day-refresh.js?v=20260816-refresh2'" "$PUBLIC_DIR/app.js" | head -1 | cut -d: -f1)"
          test "$photo_line" -lt "$camera_line" || {
            echo 'Photo preparation module must load before native camera module.' >&2
            exit 1
          }
          test "$theme_line" -lt "$refresh_line" || {
            echo 'Theme module must load before day refresh module.' >&2
            exit 1
          }

          if grep -R -E 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|ACCESS_FINE_LOCATION|RECORD_AUDIO)' android/app/src/main/AndroidManifest.xml; then
            echo 'Unexpected sensitive Android permission found.' >&2
            exit 1
          fi

      - name: Build release packages without signing material
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Upload generated Android project
        uses: actions/upload-artifact@v4
        with:
          name: android-project-unsigned-validation-v1.0.3
          path: android
          if-no-files-found: error
          retention-days: 7

      - name: Upload unsigned validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-validation-v1.0.3
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

  signed-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check signing material
        id: signing
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing secrets are not configured; signed APK/AAB will not be produced.'
          fi

      - uses: actions/checkout@v6
        if: steps.signing.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies and generate Android project
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:web
          npx cap add android
          npm run native:assets
          npx cap sync android
          bash scripts/configure-android-version.sh

      - name: Restore release keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore

      - name: Configure release signing
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          text = p.read_text()
          marker = '    buildTypes {'
          if marker not in text:
              raise SystemExit('buildTypes marker not found in generated Gradle file')
          signing = '''    signingConfigs {\n        release {\n            storeFile file('release.keystore')\n            storePassword System.getenv('KEYSTORE_PASSWORD')\n            keyAlias System.getenv('KEY_ALIAS')\n            keyPassword System.getenv('KEY_PASSWORD')\n            storeType 'JKS'\n        }\n    }\n\n'''
          text = text.replace(marker, signing + marker, 1)
          build_types_index = text.index(marker)
          release_marker = "        release {\n"
          release_index = text.find(release_marker, build_types_index)
          if release_index < 0:
              raise SystemExit('release buildType not found')
          insert_at = release_index + len(release_marker)
          text = text[:insert_at] + "            signingConfig signingConfigs.release\n" + text[insert_at:]
          p.write_text(text)
          PY

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Verify package metadata and signatures
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' -print -quit)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
          test -n "$APK"
          test -n "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee android/release-badging.txt
          grep "package: name='pl.aimonitor.zywienia' versionCode='4' versionName='1.0.3'" android/release-badging.txt

      - name: Upload signed release packages
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-monitor-zywienia-v1.0.3-signed-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/release-badging.txt
          if-no-files-found: error
          retention-days: 30
