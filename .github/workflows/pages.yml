name: Deploy PWA to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Attach frontend extensions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="confirm-modal.js?v=20260814-10" defer></script>',
              '<script src="analysis-item-removal.js?v=20260814-1" defer></script>',
              '<script src="photo-compression.js?v=20260814-1" defer></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', f'  {tag}\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
