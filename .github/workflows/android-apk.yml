name: Build Android APK

on:
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Wiem-co-Zre-m-z-AI-standalone-v1.1.2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wiem-co-Zre-m-z-AI-standalone-v1.1.2
          path: Wiem-co-Zre-m-z-AI-standalone-v1.1.2.apk
          if-no-files-found: error
