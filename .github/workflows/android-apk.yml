name: Build Android APK and AAB

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK and AAB
        run: gradle -p android-app assembleDebug bundleDebug --no-daemon

      - name: Prepare artifacts
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Wiem-co-Zre-m-z-AI-v1.1.4-api36.apk
          cp android-app/app/build/outputs/bundle/debug/app-debug.aab Wiem-co-Zre-m-z-AI-v1.1.4-api36.aab
          sha256sum Wiem-co-Zre-m-z-AI-v1.1.4-api36.apk Wiem-co-Zre-m-z-AI-v1.1.4-api36.aab > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wiem-co-Zre-m-z-AI-v1.1.4-api36-APK
          path: Wiem-co-Zre-m-z-AI-v1.1.4-api36.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Wiem-co-Zre-m-z-AI-v1.1.4-api36-AAB
          path: Wiem-co-Zre-m-z-AI-v1.1.4-api36.aab
          if-no-files-found: error

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: Wiem-co-Zre-m-z-AI-v1.1.4-api36-checksums
          path: SHA256SUMS.txt
          if-no-files-found: error
