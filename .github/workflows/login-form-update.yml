name: One-off install flow repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/login-form-update.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair PWA install flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.js')
          s = app.read_text(encoding='utf-8')

          standalone_block = '''function isStandalone() {

  return (
    window.matchMedia(
      '(display-mode: standalone)'
    ).matches ||
    window.navigator.standalone === true
  );
}
'''

          helpers = standalone_block + r'''

function isEmbeddedBrowser() {

  const ua =
    String(
      navigator.userAgent || ''
    );


  return /FBAN|FBAV|FB_IAB|Messenger|Instagram|TikTok|Line\/|; wv\)|\bwv\b/i.test(
    ua
  );
}


function showInstallGuidance(
  message,
  embedded = false
) {

  const hint =
    $('installHint');


  if (hint) {
    hint.textContent =
      message;

    hint.classList.remove(
      'hidden'
    );
  }


  const button =
    $('installFirstBtn');


  if (button) {

    const title =
      button.querySelector(
        'strong'
      );

    const subtitle =
      button.querySelector(
        'small'
      );


    if (embedded) {

      if (title) {
        title.textContent =
          'Otwórz w Chrome / przeglądarce';
      }

      if (subtitle) {
        subtitle.textContent =
          'Użyj menu tej aplikacji i wybierz otwarcie linku w Chrome lub domyślnej przeglądarce.';
      }

    } else {

      if (title) {
        title.textContent =
          'Zainstaluj aplikację';
      }

      if (subtitle) {
        subtitle.textContent =
          'Jeśli instalacja nie pojawi się automatycznie, użyj menu przeglądarki.';
      }

    }
  }
}
'''

          if 'function isEmbeddedBrowser()' not in s:
              if standalone_block not in s:
                  raise SystemExit('isStandalone marker not found')
              s = s.replace(standalone_block, helpers, 1)

          old_fallback = '''  const ios =
    /iphone|ipad|ipod/i.test(
      navigator.userAgent
    );


  if (ios) {

    alert(
      'Na iPhonie otwórz aplikację w Safari, stuknij Udostępnij i wybierz „Dodaj do ekranu początkowego”.'
    );

  } else {

    alert(
      'Jeśli przeglądarka nie pokazuje instalacji automatycznie, otwórz jej menu i wybierz „Zainstaluj aplikację” albo „Dodaj do ekranu głównego”.'
    );

  }
'''

          new_fallback = '''  if (
    isEmbeddedBrowser()
  ) {

    showInstallGuidance(
      'Ten link jest otwarty we wbudowanej przeglądarce. Otwórz menu i wybierz „Otwórz w Chrome” albo „Otwórz w przeglądarce”, a następnie zainstaluj aplikację stamtąd.',
      true
    );

    return;
  }


  const ios =
    /iphone|ipad|ipod/i.test(
      navigator.userAgent
    );


  showInstallGuidance(
    ios
      ? 'Na iPhonie otwórz menu Udostępnij w Safari i wybierz „Dodaj do ekranu początkowego”.'
      : 'Instalacja z tego przycisku nie jest teraz dostępna. Użyj menu przeglądarki i wybierz „Zainstaluj aplikację” albo „Dodaj do ekranu głównego”.'
  );
'''

          if old_fallback in s:
              s = s.replace(old_fallback, new_fallback, 1)
          elif new_fallback not in s:
              raise SystemExit('install fallback marker not found')

          old_gate = '''  if (
    !isStandalone()
  ) {

    $('authScreen')
      ?.classList.add(
        'install-only'
      );

    hide('app');
    show('authScreen');
    refreshInstallButtons();
    hideSplash();

    return;
  }

  $('authScreen')
    ?.classList.remove(
      'install-only'
    );

  refreshInstallButtons();
'''

          new_gate = '''  if (
    !isStandalone() &&
    isEmbeddedBrowser()
  ) {

    $('authScreen')
      ?.classList.add(
        'install-only'
      );

    hide('app');
    show('authScreen');
    refreshInstallButtons();

    showInstallGuidance(
      'Aby zainstalować lub uruchomić aplikację poprawnie, otwórz ten link w Chrome albo w domyślnej przeglądarce telefonu.',
      true
    );

    hideSplash();

    return;
  }

  $('authScreen')
    ?.classList.remove(
      'install-only'
    );

  refreshInstallButtons();
'''

          if old_gate in s:
              s = s.replace(old_gate, new_gate, 1)
          elif new_gate not in s:
              raise SystemExit('browser gate marker not found')

          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          i = index.read_text(encoding='utf-8')
          i = re.sub(r'app\.js\?v=20260814-\d+', 'app.js?v=20260814-15', i)
          index.write_text(i, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r'ai-monitor-zywienia-20260814-\d+', 'ai-monitor-zywienia-20260814-15', w)
          w = re.sub(r'app\.js\?v=20260814-\d+', 'app.js?v=20260814-15', w)
          sw.write_text(w, encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html sw.js
          git commit -m "Repair PWA install flow for embedded browsers"
          git push
