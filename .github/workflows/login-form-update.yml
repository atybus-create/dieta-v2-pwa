name: One-off diet login form update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch frontend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          old = '20260814-9'
          new = '20260814-10'

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          a = s.index('        <h2>\n          Wybierz istniejącego użytkownika\n        </h2>')
          b = s.index('        <label\n          class="field-label"\n          for="profilePin"', a)
          block = '''        <h2>
          ZALOGUJ SIĘ
        </h2>

        <label
          class="field-label"
          for="profileLogin"
        >
          Imię lub login
        </label>

        <div class="login-field-wrap">
          <input
            id="profileLogin"
            type="text"
            autocomplete="username"
            maxlength="60"
            placeholder="Wpisz imię lub login"
          >
        </div>


'''
          s = s[:a] + block + s[b:]
          s = s.replace('Przypisz profil do tego urządzenia', 'Zaloguj', 1)
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('app.js')
          s = p.read_text(encoding='utf-8')
          a = s.index('function renderProfileChoices(')
          b = s.index('async function loadProfiles()', a)
          s = s[:a] + '''function renderProfileChoices(users = []) {
  state.profiles = Array.isArray(users) ? users : [];
}


''' + s[b:]
          a = s.index('async function claimProfile()')
          b = s.index('async function createUser()', a)
          claim = '''async function claimProfile() {
  hide('authError');

  const login = $('profileLogin')?.value.trim() || '';
  const accessPin = $('profilePin')?.value.trim() || '';

  if (!login || !accessPin) {
    $('authError').textContent = 'Wpisz imię lub login oraz PIN.';
    show('authError');
    return;
  }

  const norm = value => String(value || '').trim().toLocaleLowerCase('pl-PL');
  const wanted = norm(login);
  const byUserId = state.profiles.find(user => norm(user.userId) === wanted);
  const byName = state.profiles.filter(user => norm(user.displayName) === wanted);

  if (!byUserId && byName.length > 1) {
    $('authError').textContent = 'To imię pasuje do kilku profili. Wpisz login.';
    show('authError');
    return;
  }

  const profile = byUserId || byName[0];
  if (!profile?.userId) {
    $('authError').textContent = 'Nieprawidłowe imię/login lub PIN.';
    show('authError');
    return;
  }

  loading(true, 'Loguję…', 'Weryfikuję dane i zabezpieczam tę instalację.');

  try {
    const data = await post(AUTH, {userId: profile.userId, accessPin});
    rememberSession(data.accessToken, data.userId, profile.displayName || login || data.userId);
    await enterApp();
  } catch (e) {
    $('authError').textContent = 'Nieprawidłowe imię/login lub PIN.';
    show('authError');
  } finally {
    loading(false);
  }
}


'''
          s = s[:a] + claim + s[b:]
          hook = "  $('claimProfileBtn').onclick =\n    claimProfile;\n\n\n  $('createUserBtn').onclick =\n    createUser;"
          hook2 = "  $('claimProfileBtn').onclick =\n    claimProfile;\n\n\n  ['profileLogin', 'profilePin'].forEach(id => $(id)?.addEventListener('keydown', event => {\n    if (event.key === 'Enter') {\n      event.preventDefault();\n      claimProfile();\n    }\n  }));\n\n\n  $('createUserBtn').onclick =\n    createUser;"
          if hook not in s:
            raise SystemExit('auth hook not found')
          s = s.replace(hook, hook2, 1)
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '.pin-field-wrap {\n  position: relative;\n}'
          if marker not in s:
            raise SystemExit('css marker not found')
          s = s.replace(marker, '.login-field-wrap {\n  margin-bottom: 18px;\n}\n\n\n' + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8').replace(old, new)
          p.write_text(s, encoding='utf-8')

          assert 'Wybierz istniejącego użytkownika' not in Path('index.html').read_text(encoding='utf-8')
          assert 'id="profileLogin"' in Path('index.html').read_text(encoding='utf-8')
          assert 'ZALOGUJ SIĘ' in Path('index.html').read_text(encoding='utf-8')
          PY
      - name: Commit changes
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js styles.css sw.js
          git commit -m 'Replace profile chooser with login and PIN form'
          git push
