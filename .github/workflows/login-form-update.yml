name: One-off install-first PWA gate

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Trigger install-first PWA gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old = '20260814-10'
          new = '20260814-11'

          # index.html: update copy and cache-busting version
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_hint = 'Instalacja jest opcjonalna. Profil możesz przypisać również w przeglądarce.'
          new_hint = 'Zainstaluj aplikację, aby przejść do logowania i konfiguracji profilu.'
          if old_hint not in s:
              raise RuntimeError('Expected install hint not found')
          s = s.replace(old_hint, new_hint, 1)
          if old not in s:
              raise RuntimeError('Expected asset version not found in index.html')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # styles.css: browser mode shows only install section
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          marker = '''.auth-shell {
  width: min(580px, 100%);

  display: grid;

  gap: 17px;
}
'''
          addition = marker + '''

.auth-screen.install-only {
  place-items: center;
}


.auth-screen.install-only .auth-intro,
.auth-screen.install-only #existingProfiles,
.auth-screen.install-only #newUserDetails,
.auth-screen.install-only #authError,
.auth-screen.install-only .security-note {
  display: none !important;
}


.auth-screen.install-only .auth-shell {
  width: min(580px, 100%);
}


.auth-screen.install-only .install-card {
  margin: 0;
}
'''
          if marker not in s:
              raise RuntimeError('Expected auth-shell CSS marker not found')
          s = s.replace(marker, addition, 1)
          p.write_text(s, encoding='utf-8')

          # app.js: enforce standalone before any session/auth flow
          p = Path('app.js')
          s = p.read_text(encoding='utf-8')

          old_refresh = '''function refreshInstallButtons() {

  const buttons = [
    $('installFirstBtn'),
    $('installBtn')
  ].filter(Boolean);


  if (
    isStandalone()
  ) {

    buttons.forEach(
      button =>
        button.classList.add(
          'hidden'
        )
    );

    return;

  }


  buttons.forEach(
    button =>
      button.classList.remove(
        'hidden'
      )
  );
}
'''
          new_refresh = '''function refreshInstallButtons() {

  const buttons = [
    $('installFirstBtn'),
    $('installBtn')
  ].filter(Boolean);

  const hint =
    $('installHint');


  if (
    isStandalone()
  ) {

    buttons.forEach(
      button =>
        button.classList.add(
          'hidden'
        )
    );

    hint?.classList.add(
      'hidden'
    );

    return;

  }


  buttons.forEach(
    button =>
      button.classList.remove(
        'hidden'
      )
  );

  hint?.classList.remove(
    'hidden'
  );
}
'''
          if old_refresh not in s:
              raise RuntimeError('Expected refreshInstallButtons function not found')
          s = s.replace(old_refresh, new_refresh, 1)

          appinstalled_old = '''  window.addEventListener(
    'appinstalled',
    () => {

      state.deferredPrompt =
        null;

      refreshInstallButtons();

    }
  );
'''
          appinstalled_new = '''  window.addEventListener(
    'appinstalled',
    () => {

      state.deferredPrompt =
        null;

      if (!isStandalone()) {

        $('installFirstBtn')
          ?.classList.add(
            'hidden'
          );

        if ($('installHint')) {
          $('installHint').textContent =
            'Aplikacja została zainstalowana. Uruchom ją z ikony na ekranie głównym.';
        }

        return;
      }

      refreshInstallButtons();

    }
  );
'''
          if appinstalled_old not in s:
              raise RuntimeError('Expected appinstalled handler not found')
          s = s.replace(appinstalled_old, appinstalled_new, 1)

          marker = '''  /*
    Jeżeli token istnieje:
    backend sam ustala userId z tokenu.
  */
'''
          gate = '''  /*
    Link otwarty w zwykłej przeglądarce:
    pokazujemy wyłącznie instalację PWA.
    Logowanie i tworzenie profilu są dostępne dopiero
    po uruchomieniu zainstalowanej aplikacji w trybie standalone.
  */

  if (
    !isStandalone()
  ) {

    $('authScreen')
      ?.classList.add(
        'install-only'
      );

    hide(
      'app'
    );

    show(
      'authScreen'
    );

    refreshInstallButtons();
    hideSplash();

    return;
  }


  $('authScreen')
    ?.classList.remove(
      'install-only'
    );

  refreshInstallButtons();


''' + marker
          if marker not in s:
              raise RuntimeError('Expected token-flow marker not found')
          s = s.replace(marker, gate, 1)

          if old not in s:
              raise RuntimeError('Expected version not found in app.js')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # sw.js: force fresh PWA shell
          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          if old not in s:
              raise RuntimeError('Expected version not found in sw.js')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Validation
          index = Path('index.html').read_text(encoding='utf-8')
          css = Path('styles.css').read_text(encoding='utf-8')
          app = Path('app.js').read_text(encoding='utf-8')
          sw = Path('sw.js').read_text(encoding='utf-8')

          assert 'Zainstaluj aplikację, aby przejść do logowania' in index
          assert '.auth-screen.install-only #existingProfiles' in css
          assert '.auth-screen.install-only #newUserDetails' in css
          assert "!isStandalone()" in app
          assert "classList.add(\n        'install-only'" in app
          assert "Aplikacja została zainstalowana. Uruchom ją z ikony" in app
          assert new in index and new in app and new in sw
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -F 'Zainstaluj aplikację, aby przejść do logowania' index.html
          grep -F '.auth-screen.install-only #existingProfiles' styles.css
          grep -F "'install-only'" app.js
          grep -F 'ai-monitor-zywienia-20260814-11' sw.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css app.js sw.js
          git commit -m 'Require PWA installation before login'
          git push
