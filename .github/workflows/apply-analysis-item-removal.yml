name: One-time patch analysis item removal

on:
  push:
    paths:
      - '.github/workflows/apply-analysis-item-removal.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch analysis item removal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('app.js')
          app = app_path.read_text(encoding='utf-8')

          start = app.index('function renderAnalysis(\n  analysis\n) {')
          end = app.index('async function analyzeText()', start)

          new_block = r'''function recalculateAnalysisTotals() {

  if (!state.analysis) {
    return;
  }


  const items =
    Array.isArray(state.analysis.items)
      ? state.analysis.items
      : [];


  const total = key =>
    Math.round(
      items.reduce(
        (sum, item) =>
          sum + Number(item?.[key] || 0),
        0
      )
    );


  state.analysis.calories =
    total('calories');

  state.analysis.protein =
    total('protein');

  state.analysis.carbs =
    total('carbs');

  state.analysis.fat =
    total('fat');


  if ($('analysisCalories')) {
    $('analysisCalories').value =
      state.analysis.calories;
  }
}


function removeAnalysisItem(
  index
) {

  if (
    !state.analysis ||
    !Array.isArray(state.analysis.items)
  ) {
    return;
  }


  if (
    state.analysis.items.length <= 1
  ) {

    toast(
      'Posiłek musi zawierać co najmniej jeden składnik.'
    );

    return;
  }


  const item =
    state.analysis.items[index];


  if (!item) {
    return;
  }


  state.analysis.items.splice(
    index,
    1
  );


  recalculateAnalysisTotals();


  renderAnalysis(
    state.analysis,
    false
  );


  toast(
    `${item.namePl || 'Składnik'} usunięty`
  );
}


function renderAnalysis(
  analysis,
  scrollToPanel = true
) {

  state.analysis =
    analysis;


  $('analysisDescription').value =
    analysis.description ||
    '';


  recalculateAnalysisTotals();


  const confidence =
    String(
      analysis.confidence || ''
    ).toLowerCase();


  if (
    confidence === 'high'
  ) {

    $('analysisConfidence').textContent =
      'Wysoka pewność';

  } else if (
    confidence === 'medium'
  ) {

    $('analysisConfidence').textContent =
      'Średnia pewność';

  } else if (
    confidence === 'low'
  ) {

    $('analysisConfidence').textContent =
      'Niska pewność';

  } else {

    $('analysisConfidence').textContent =
      analysis.confidence ||
      '';

  }


  $('analysisItems').innerHTML =
    (
      analysis.items || []
    )
      .map(
        (item, index) =>
          `
          <div class="analysis-item">

            <span class="analysis-item-copy">
              ${escapeHtml(item.namePl)}
              ·
              ${Math.round(item.grams || 0)} g
            </span>

            <div class="analysis-item-actions">

              <strong>
                ${Math.round(item.calories || 0)} kcal
              </strong>

              <button
                class="analysis-remove-btn"
                data-analysis-del="${index}"
                type="button"
                aria-label="Usuń ${escapeHtml(item.namePl)} z posiłku"
              >
                Usuń
              </button>

            </div>

          </div>
          `
      )
      .join('');


  $('analysisItems')
    .querySelectorAll(
      '[data-analysis-del]'
    )
    .forEach(
      button => {

        button.onclick =
          () =>
            removeAnalysisItem(
              Number(
                button.dataset.analysisDel
              )
            );

      }
    );


  show(
    'analysisPanel'
  );


  if (scrollToPanel) {

    setTimeout(
      () =>
        $('analysisPanel')
          ?.scrollIntoView({
            behavior:
              'smooth',

            block:
              'start'
          }),
      80
    );

  }
}


'''

          app = app[:start] + new_block + app[end:]
          app = app.replace('20260814-9', '20260814-10')
          app_path.write_text(app, encoding='utf-8')

          css_path = Path('styles.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* analysis item removal v10 */'
          if marker not in css:
            css += r'''

/* analysis item removal v10 */
.analysis-item-copy {
  min-width: 0;
  flex: 1;
}

.analysis-item-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

.analysis-remove-btn {
  min-height: 36px;
  padding: 7px 11px;
  border: 1px solid rgba(255, 103, 120, .22);
  border-radius: 10px;
  color: #ff8895;
  background: rgba(255, 83, 103, .08);
  font: inherit;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.analysis-remove-btn:active {
  transform: scale(.98);
}

@media (max-width: 420px) {
  .analysis-item {
    align-items: flex-start;
  }

  .analysis-item-actions {
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
  }
}
'''
          css_path.write_text(css, encoding='utf-8')

          for filename in ['index.html', 'sw.js']:
            path = Path(filename)
            text = path.read_text(encoding='utf-8').replace('20260814-9', '20260814-10')
            path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-analysis-item-removal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html sw.js .github/workflows/apply-analysis-item-removal.yml
          git commit -m "Restore per-item removal in meal analysis"
          git push
